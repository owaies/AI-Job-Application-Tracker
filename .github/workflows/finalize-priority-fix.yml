name: Finalize Priority Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'fix: correct priority filter select value wiring')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply exact source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/App.tsx')
          s = p.read_text()
          diagnostic = re.compile(r"\n  const runtimeActive: unknown = active\n  if \(typeof runtimeActive !== 'string'\) \{.*?\n  \}\n", re.S)
          s, removed = diagnostic.subn('\n', s, count=1)
          if removed != 1: raise SystemExit(f'Expected exactly one temporary CustomSelect diagnostic, removed {removed}.')
          old_props = "function CustomSelect({ label, value, options, onChange, placeholder = 'SELECT' }: { label?: string; value: string; options: string[]; onChange: (value: string) => void; placeholder?: string }) {"
          new_props = "export interface CustomSelectProps {\n  label?: string\n  value: string\n  options: string[]\n  onChange: (value: string) => void\n  placeholder?: string\n}\n\nfunction CustomSelect({ label, value, options, onChange, placeholder = 'SELECT' }: CustomSelectProps) {"
          if s.count(old_props) != 1: raise SystemExit(f'Expected one original CustomSelect declaration, found {s.count(old_props)}')
          s = s.replace(old_props, new_props, 1)
          old_sig = "function ApplicationsPage({ applications, search, setSearch, statusFilter, setStatusFilter, priorityFilter, setPriorityFilter, sort, setSort, go, onAdd, onEdit, onDelete }: any)"
          new_sig = "type ApplicationsPageProps = {\n  applications: JobApplication[]\n  search: string\n  setSearch: (value: string) => void\n  statusFilter: string\n  setStatusFilter: (value: string) => void\n  priorityFilter: string\n  setPriorityFilter: (value: string) => void\n  sort: string\n  setSort: (value: string) => void\n  go: (p: string) => void\n  onAdd: () => void\n  onEdit: (application: JobApplication) => void\n  onDelete: (id: number) => void\n}\n\nfunction ApplicationsPage({ applications, search, setSearch, statusFilter, setStatusFilter, priorityFilter, setPriorityFilter, sort, setSort, go, onAdd, onEdit, onDelete }: ApplicationsPageProps)"
          if s.count(old_sig) != 1: raise SystemExit(f'Expected one untyped ApplicationsPage declaration, found {s.count(old_sig)}')
          s = s.replace(old_sig, new_sig, 1)
          if 'value={priorityFilter}' not in s or 'onChange={setPriorityFilter}' not in s: raise SystemExit('Priority filter wiring is not present')
          if 'value={setPriorityFilter}' in s or 'priorityFilter={setPriorityFilter}' in s: raise SystemExit('Incorrect priority setter-to-value wiring remains')
          if 'CustomSelect invalid value' in s: raise SystemExit('Temporary diagnostic code remains')
          p.write_text(s)
          PY
      - name: Frontend TypeScript/build
        working-directory: frontend
        run: npm install && npm run build
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          PYTHONPATH=. pytest backend/tests
      - name: Relevant frontend tests
        working-directory: frontend
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test -- --run; else echo 'No frontend test script configured.'; fi
      - name: Verify exact production source contract
        run: |
          test -f frontend/src/ErrorBoundary.tsx
          grep -F "<ErrorBoundary>" frontend/src/main.tsx
          grep -F "value={priorityFilter}" frontend/src/App.tsx
          grep -F "onChange={setPriorityFilter}" frontend/src/App.tsx
          grep -F "export interface CustomSelectProps" frontend/src/App.tsx
          ! grep -F "CustomSelect invalid value" frontend/src/App.tsx
          ! grep -F "value={setPriorityFilter}" frontend/src/App.tsx
      - name: Commit actual source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-priority-fix.yml .github/workflows/debug-source-map.yml .github/workflows/apply-custom-select-fix.yml
          git add frontend/src/App.tsx frontend/src/custom-select.contract.ts .github/workflows/finalize-priority-fix.yml .github/workflows/debug-source-map.yml .github/workflows/apply-custom-select-fix.yml
          git commit -m 'fix: correct priority filter select value wiring'
          git push origin main
