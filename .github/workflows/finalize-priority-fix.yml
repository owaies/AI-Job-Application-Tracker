name: Finalize Priority Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'fix: correct priority filter select value wiring')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply exact source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          s = p.read_text()
          old = "function CustomSelect({ label, value, options, onChange, placeholder = 'SELECT' }: { label?: string; value: string; options: string[]; onChange: (value: string) => void; placeholder?: string }) {\n  const [open, setOpen] = useState(false)\n  const ref = useRef<HTMLDivElement>(null)\n  const active = value || placeholder\n  const runtimeActive: unknown = active\n  if (typeof runtimeActive !== 'string') {\n    const tag = Object.prototype.toString.call(runtimeActive)\n    const description = typeof runtimeActive === 'function' ? `[Function ${runtimeActive.name || 'anonymous'}]` : String(runtimeActive)\n    throw new Error(`CustomSelect invalid value: label=${String(label)}; type=${typeof runtimeActive}; tag=${tag}; value=${description}`)\n  }"
          new = "export interface CustomSelectProps {\n  label?: string\n  value: string\n  options: string[]\n  onChange: (value: string) => void\n  placeholder?: string\n}\n\nfunction CustomSelect({ label, value, options, onChange, placeholder = 'SELECT' }: CustomSelectProps) {\n  const [open, setOpen] = useState(false)\n  const ref = useRef<HTMLDivElement>(null)\n  const active = value || placeholder"
          if old not in s:
              raise SystemExit('Expected temporary CustomSelect diagnostic block not found')
          s = s.replace(old, new, 1)
          old_sig = "function ApplicationsPage({ applications, search, setSearch, statusFilter, setStatusFilter, priorityFilter, setPriorityFilter, sort, setSort, go, onAdd, onEdit, onDelete }: any)"
          new_sig = "type ApplicationsPageProps = {\n  applications: JobApplication[]\n  search: string\n  setSearch: (value: string) => void\n  statusFilter: string\n  setStatusFilter: (value: string) => void\n  priorityFilter: string\n  setPriorityFilter: (value: string) => void\n  sort: string\n  setSort: (value: string) => void\n  go: (p: string) => void\n  onAdd: () => void\n  onEdit: (application: JobApplication) => void\n  onDelete: (id: number) => void\n}\n\nfunction ApplicationsPage({ applications, search, setSearch, statusFilter, setStatusFilter, priorityFilter, setPriorityFilter, sort, setSort, go, onAdd, onEdit, onDelete }: ApplicationsPageProps)"
          if old_sig not in s:
              raise SystemExit('Expected untyped ApplicationsPage props not found')
          s = s.replace(old_sig, new_sig, 1)
          if 'value={priorityFilter}' not in s or 'onChange={setPriorityFilter}' not in s:
              raise SystemExit('Priority filter wiring is not present')
          if 'CustomSelect invalid value' in s:
              raise SystemExit('Temporary diagnostic code remains')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/custom-select.contract.ts')
          if p.exists():
              s = p.read_text()
              if "import type { CustomSelectProps } from './App'" not in s:
                  raise SystemExit('CustomSelect contract is not using App prop type')
          PY

      - name: Frontend install and build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Backend tests
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          fi
          if [ -d backend ] && find backend -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest backend
          else
            echo 'No backend pytest files found; backend test suite not available in repository.'
          fi

      - name: Relevant frontend tests
        working-directory: frontend
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then npm test -- --run; else echo 'No frontend test script configured.'; fi

      - name: Verify production boundary and source contract
        run: |
          test -f frontend/src/ErrorBoundary.tsx
          grep -F "<ErrorBoundary>" frontend/src/main.tsx
          grep -F "value={priorityFilter}" frontend/src/App.tsx
          grep -F "onChange={setPriorityFilter}" frontend/src/App.tsx
          grep -F "export interface CustomSelectProps" frontend/src/App.tsx
          ! grep -F "CustomSelect invalid value" frontend/src/App.tsx
          ! grep -F "function ApplicationsPage({ applications, search, setSearch, statusFilter, setStatusFilter, priorityFilter, setPriorityFilter, sort, setSort, go, onAdd, onEdit, onDelete }: any)" frontend/src/App.tsx

      - name: Commit actual source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-priority-fix.yml
          git add frontend/src/App.tsx frontend/src/custom-select.contract.ts .github/workflows/finalize-priority-fix.yml
          git commit -m 'fix: correct priority filter select value wiring'
          git push origin main
