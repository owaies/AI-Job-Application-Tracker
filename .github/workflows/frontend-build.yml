name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --include=dev
      - name: Build default Vite production bundle
        run: |
          cd frontend
          npm run build
      - name: Build with alternate minifier
        run: |
          cd frontend
          npx vite build --minify esbuild --outDir dist-esbuild
      - name: Compare compiled ApplicationsPage wiring
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          function inspect(dir) {
            const js = fs.readdirSync(path.join(dir,'assets')).find(f => f.endsWith('.js') && !f.endsWith('.map'))
            const code = fs.readFileSync(path.join(dir,'assets',js), 'utf8')
            const needles = ['setPriorityFilter', 'priorityFilter:']
            console.log(`--- ${dir}/${js} ---`)
            for (const needle of needles) {
              let p=0, n=0
              while ((p=code.indexOf(needle,p)) !== -1 && n<5) {
                console.log(`${needle}@${p}: ${code.slice(Math.max(0,p-180),p+420)}`)
                p += needle.length; n++
              }
            }
          }
          inspect('frontend/dist')
          inspect('frontend/dist-esbuild')
          NODE
      - name: Verify source map locations
        run: |
          cd frontend
          npm install --no-save source-map@0.7.6
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const { SourceMapConsumer } = require('source-map')
          const mapFile = fs.readdirSync('dist/assets').find(f => f.endsWith('.js.map'))
          const map = JSON.parse(fs.readFileSync(path.join('dist/assets', mapFile), 'utf8'))
          SourceMapConsumer.with(map, null, consumer => {
            for (const [line, column] of [[9,43552],[9,44427],[9,45177],[9,60864],[9,71054],[9,75492]]) {
              console.log(`GENERATED ${line}:${column} -> ${JSON.stringify(consumer.originalPositionFor({line,column,bias:SourceMapConsumer.GREATEST_LOWER_BOUND}))}`)
            }
          })
          NODE
