name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect live source before fix
        run: |
          echo '--- CustomSelect definitions ---'
          grep -n 'function CustomSelect' frontend/src/App.tsx || true
          echo '--- priorityFilter occurrences ---'
          grep -n 'priorityFilter' frontend/src/App.tsx || true
          echo '--- PRIORITY CustomSelect call ---'
          grep -n 'CustomSelect label="PRIORITY"' frontend/src/App.tsx || true
          echo '--- diagnostic marker ---'
          grep -n 'runtimeActive' frontend/src/App.tsx || true
          exit 1
