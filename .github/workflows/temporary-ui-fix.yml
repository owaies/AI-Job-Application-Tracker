name: temporary-ui-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix confirmation focus
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          s = p.read_text()
          old = 'ref={cancelRef as never} '
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, 'autoFocus ', 1))
          PY
          rm -f .github/workflows/temporary-ui-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx .github/workflows/temporary-ui-fix.yml
          git commit -m 'fix: repair custom confirmation focus'
          git push
