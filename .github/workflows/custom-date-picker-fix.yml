name: Custom date picker fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch date picker
        shell: python
        run: |
          from pathlib import Path

          app = Path('frontend/src/App.tsx')
          css = Path('frontend/src/styles.css')
          text = app.read_text()

          start = text.index('function CustomDateTime(')
          end = text.index('\n\nfunction ConfirmModal', start)

          replacement = '''function parsePickerValue(value: string) {
  if (!value) return null
  const [datePart, timePart = '00:00'] = value.replace('T', ' ').split(' ')
  const dateBits = datePart.split('-').map(Number)
  const timeBits = timePart.split(':').map(Number)
  if (dateBits.length !== 3 || dateBits.some(Number.isNaN)) return null
  const date = new Date(dateBits[0], dateBits[1] - 1, dateBits[2], timeBits[0] || 0, timeBits[1] || 0)
  return Number.isNaN(date.getTime()) ? null : date
}

function pickerValue(date: Date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`
}

function CustomDateTime({ label, value, onChange }: { label: string; value: string; onChange: (value: string) => void }) {
  const [open, setOpen] = useState(false)
  const initial = parsePickerValue(value) || new Date()
  const [draft, setDraft] = useState(initial)
  const [month, setMonth] = useState(new Date(initial.getFullYear(), initial.getMonth(), 1))

  useEffect(() => {
    if (!open) return
    const current = parsePickerValue(value) || new Date()
    setDraft(current)
    setMonth(new Date(current.getFullYear(), current.getMonth(), 1))
    const previous = document.body.style.overflow
    document.body.style.overflow = 'hidden'
    const key = (e: KeyboardEvent) => { if (e.key === 'Escape') setOpen(false) }
    document.addEventListener('keydown', key)
    return () => { document.body.style.overflow = previous; document.removeEventListener('keydown', key) }
  }, [open])

  const days = useMemo(() => {
    const first = new Date(month.getFullYear(), month.getMonth(), 1)
    const start = new Date(month.getFullYear(), month.getMonth(), 1 - first.getDay())
    return Array.from({ length: 42 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i))
  }, [month])

  const chooseDay = (day: Date) => {
    const next = new Date(draft)
    next.setFullYear(day.getFullYear(), day.getMonth(), day.getDate())
    setDraft(next)
  }
  const changeTime = (part: 'hour' | 'minute', raw: string) => {
    const next = new Date(draft)
    const n = Math.max(0, Math.min(part === 'hour' ? 23 : 59, Number(raw) || 0))
    if (part === 'hour') next.setHours(n)
    else next.setMinutes(n)
    setDraft(next)
  }
  const shiftMonth = (amount: number) => setMonth(new Date(month.getFullYear(), month.getMonth() + amount, 1))
  const today = new Date()
  const displayValue = value ? formatDate(value, true) : 'SELECT DATE & TIME'

  return <>
    <label className="custom-date">
      <span>{label}</span>
      <button type="button" className={`custom-date-trigger ${open ? 'is-open' : ''}`} onClick={() => setOpen(true)} aria-haspopup="dialog" aria-expanded={open}>
        <span className={value ? '' : 'placeholder'}>{displayValue}</span><b aria-hidden="true">▣</b>
      </button>
      <small>LOCAL TIME · 24 HOUR · CUSTOM PICKER</small>
    </label>
    {open && <div className="custom-picker-backdrop" role="presentation" onMouseDown={e => { if (e.currentTarget === e.target) setOpen(false) }}>
      <section className="custom-picker" role="dialog" aria-modal="true" aria-labelledby={`${label.replaceAll(' ', '-')}-picker-title`}>
        <div className="custom-picker-head"><div><span className="kicker">{label.toUpperCase()} // 01</span><h2 id={`${label.replaceAll(' ', '-')}-picker-title`}>Set date & time</h2></div><button type="button" className="icon-btn" onClick={() => setOpen(false)} aria-label="Close date picker">×</button></div>
        <div className="custom-picker-body">
          <div className="calendar-block">
            <div className="calendar-nav"><button type="button" onClick={() => shiftMonth(-1)} aria-label="Previous month">←</button><strong>{month.toLocaleDateString([], { month: 'long', year: 'numeric' })}</strong><button type="button" onClick={() => shiftMonth(1)} aria-label="Next month">→</button></div>
            <div className="calendar-weekdays">{['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => <span key={d}>{d}</span>)}</div>
            <div className="calendar-grid">{days.map(day => { const same = day.toDateString() === draft.toDateString(); const outside = day.getMonth() !== month.getMonth(); const isToday = day.toDateString() === today.toDateString(); return <button type="button" key={day.toISOString()} className={`calendar-day ${same ? 'selected' : ''} ${outside ? 'outside' : ''} ${isToday ? 'today' : ''}`} onClick={() => chooseDay(day)} aria-label={day.toDateString()}>{day.getDate()}</button> })}</div>
            <button type="button" className="calendar-today" onClick={() => { const now = new Date(); setDraft(now); setMonth(new Date(now.getFullYear(), now.getMonth(), 1)) }}>TODAY ↗</button>
          </div>
          <div className="time-block">
            <span className="time-label">TIME / 24 HOUR</span>
            <div className="time-readout"><strong>{pad(draft.getHours())}</strong><span>:</span><strong>{pad(draft.getMinutes())}</strong></div>
            <div className="time-control"><div><button type="button" onClick={() => changeTime('hour', String((draft.getHours() + 1) % 24))}>+</button><input value={pad(draft.getHours())} inputMode="numeric" aria-label="Hour" onChange={e => changeTime('hour', e.target.value)} /><button type="button" onClick={() => changeTime('hour', String((draft.getHours() + 23) % 24))}>−</button></div><span>:</span><div><button type="button" onClick={() => changeTime('minute', String((draft.getMinutes() + 5) % 60))}>+</button><input value={pad(draft.getMinutes())} inputMode="numeric" aria-label="Minute" onChange={e => changeTime('minute', e.target.value)} /><button type="button" onClick={() => changeTime('minute', String((draft.getMinutes() + 55) % 60))}>−</button></div></div>
            <div className="picker-summary"><span>SELECTED</span><strong>{draft.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' })}</strong><strong>{pad(draft.getHours())}:{pad(draft.getMinutes())}</strong></div>
          </div>
        </div>
        <div className="custom-picker-actions"><button type="button" className="picker-clear" onClick={() => { onChange(''); setOpen(false) }}>CLEAR</button><button type="button" className="picker-cancel" onClick={() => setOpen(false)}>CANCEL</button><button type="button" className="picker-set" onClick={() => { onChange(pickerValue(draft)); setOpen(false) }}>SET DATE →</button></div>
      </section>
    </div>}
  </>
}'''

          text = text[:start] + replacement + text[end:]
          app.write_text(text)

          style = '''

/* CUSTOM DATE/TIME PICKER */
.custom-date { position: relative; }
.custom-date-trigger { width: 100%; min-height: 58px; border: 3px solid var(--ink); padding: 11px 12px; background: var(--white); color: var(--ink); display: flex; align-items: center; justify-content: space-between; text-align: left; font-weight: 700; }
.custom-date-trigger:hover, .custom-date-trigger.is-open { background: var(--lime); }
.custom-date-trigger .placeholder { color: var(--muted); }
.custom-date-trigger b { font-size: 1rem; }
.custom-date small { display: block; margin-top: 6px; }
.custom-picker-backdrop { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 20px; background: rgba(17,19,26,.72); }
.custom-picker { width: min(760px, 100%); max-height: min(850px, calc(100vh - 40px)); overflow: auto; border: 4px solid var(--ink); background: var(--paper); box-shadow: 12px 12px 0 var(--pink); }
.custom-picker-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 20px; border-bottom: 3px solid var(--ink); background: var(--white); }
.custom-picker-head h2 { margin: 10px 0 0; }
.custom-picker-body { display: grid; grid-template-columns: 1.35fr .65fr; gap: 0; }
.calendar-block { padding: 20px; border-right: 3px dashed var(--ink); }
.calendar-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; margin-bottom: 18px; }
.calendar-nav button, .time-control button { min-height: 42px; border: 3px solid var(--ink); background: var(--yellow); font-weight: 900; font-size: 1.1rem; }
.calendar-nav strong { text-align: center; font-size: 1.15rem; text-transform: uppercase; }
.calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.calendar-weekdays { margin-bottom: 6px; }
.calendar-weekdays span { text-align: center; font: 700 .58rem 'Space Mono', monospace; color: var(--muted); }
.calendar-day { aspect-ratio: 1; border: 2px solid transparent; background: transparent; color: var(--ink); font-weight: 700; }
.calendar-day:hover { border-color: var(--ink); background: var(--cyan); }
.calendar-day.outside { color: #aaa; }
.calendar-day.today { border-color: var(--pink); }
.calendar-day.selected { background: var(--pink); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.calendar-today { margin-top: 14px; border: 2px solid var(--ink); background: var(--lime); padding: 8px 12px; font: 700 .62rem 'Space Mono', monospace; }
.time-block { padding: 20px; background: var(--yellow); display: flex; flex-direction: column; }
.time-label { font: 700 .65rem 'Space Mono', monospace; }
.time-readout { margin: 18px 0; padding: 12px; border: 3px solid var(--ink); background: var(--white); display: flex; justify-content: center; gap: 8px; font: 700 2.7rem 'Space Mono', monospace; }
.time-control { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 7px; }
.time-control > div { display: grid; gap: 6px; }
.time-control input { min-width: 0; text-align: center; border-width: 3px; padding: 9px 4px; font: 700 1.25rem 'Space Mono', monospace; }
.time-control > span { font-weight: 900; }
.picker-summary { margin-top: auto; padding: 14px; border: 3px dashed var(--ink); display: grid; gap: 5px; }
.picker-summary span { font: 700 .58rem 'Space Mono', monospace; }
.picker-summary strong { font-size: .9rem; }
.custom-picker-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 15px 20px; border-top: 3px solid var(--ink); background: var(--ink); }
.custom-picker-actions button { min-height: 44px; padding: 9px 14px; border: 3px solid var(--white); font-weight: 800; }
.picker-clear { margin-right: auto; background: transparent; color: white; border-color: transparent !important; }
.picker-cancel { background: var(--white); color: var(--ink); }
.picker-set { background: var(--pink); color: var(--ink); border-color: var(--ink) !important; box-shadow: 4px 4px 0 var(--yellow); }
@media (max-width: 640px) {
  .custom-picker-backdrop { padding: 0; align-items: end; }
  .custom-picker { width: 100%; max-height: 94vh; border-width: 3px 3px 0; box-shadow: 7px 0 0 var(--pink); }
  .custom-picker-head { padding: 16px; }
  .custom-picker-body { grid-template-columns: 1fr; }
  .calendar-block { border-right: 0; border-bottom: 3px dashed var(--ink); padding: 14px; }
  .calendar-day { min-height: 38px; }
  .time-block { padding: 14px; }
  .time-readout { margin: 10px 0; font-size: 2rem; }
  .picker-summary { margin-top: 12px; }
  .custom-picker-actions { padding: 12px; }
}
'''
          css_text = css.read_text()
          if '/* CUSTOM DATE/TIME PICKER */' not in css_text:
              css.write_text(css_text + style)

          wf = Path('.github/workflows/custom-date-picker-fix.yml')
          wf.unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/styles.css .github/workflows/custom-date-picker-fix.yml
          git commit -m "fix: add branded custom date time picker"
          git push
