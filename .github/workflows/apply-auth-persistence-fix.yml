name: Apply Auth Persistence Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch auth bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.tsx')
          text = path.read_text()

          text = text.replace(
              "import { api, ApplicationAnalytics, JobApplication, SmartAction, User } from './api'",
              "import { api, ApiError, ApplicationAnalytics, JobApplication, SmartAction, User } from './api'",
              1,
          )

          old = "const { path, go } = usePath(); const [token, setToken] = useState(() => localStorage.getItem(TOKEN_KEY)); const [user, setUser] = useState<User | null>(null); const [applications, setApplications] = useState<JobApplication[]>([]);"
          new = "const { path, go } = usePath(); const [token, setToken] = useState(() => localStorage.getItem(TOKEN_KEY)); const [user, setUser] = useState<User | null>(null); const [authInitializing, setAuthInitializing] = useState(() => Boolean(token)); const [authBootstrapError, setAuthBootstrapError] = useState(''); const [applications, setApplications] = useState<JobApplication[]>([]);"
          if old not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old, new, 1)

          old = "useEffect(() => { if (!token) return; api.me(token).then(u => { setUser(u); return refresh(token) }).catch(() => { localStorage.removeItem(TOKEN_KEY); setToken(null); setUser(null) }) }, [token])"
          new = "useEffect(() => { let cancelled = false; if (!token) { setUser(null); setAuthBootstrapError(''); setAuthInitializing(false); return () => { cancelled = true } }; setAuthInitializing(true); setAuthBootstrapError(''); (async () => { try { const restoredUser = await api.me(token); if (cancelled) return; setUser(restoredUser); setAuthInitializing(false); refresh(token).catch(err => { if (!cancelled) { setError('Unable to load your applications. Please try again.'); console.error(err) } }) } catch (err) { if (cancelled) return; if (err instanceof ApiError && err.status === 401) { localStorage.removeItem(TOKEN_KEY); setToken(null); setUser(null); setAuthInitializing(false); return }; setAuthBootstrapError('Unable to restore your session. Please retry.'); setAuthInitializing(false); console.error(err) } })(); return () => { cancelled = true } }, [token])"
          if old not in text:
              raise SystemExit('bootstrap anchor not found')
          text = text.replace(old, new, 1)

          old = "if (!token || !user) { const mode = path === '/register' ? 'register' : 'login'; return <Auth mode={mode} onSuccess={(t, u) => { setToken(t); setUser(u); go('/dashboard') }} /> }"
          new = "if (authInitializing) return <main className=\"auth-shell\" aria-label=\"Restoring session\"><section className=\"auth-card\"><span className=\"kicker\">JOBTRACK / SESSION</span><h1>Restoring<br /><em>session.</em></h1><p className=\"lede\">Checking your saved session securely…</p></section></main>; if (authBootstrapError) return <main className=\"auth-shell\" aria-label=\"Session restore error\"><section className=\"auth-card\"><span className=\"kicker\">JOBTRACK / SESSION</span><h1>Session<br /><em>check failed.</em></h1><p className=\"lede\">{authBootstrapError}</p><Button type=\"button\" onClick={() => { setAuthBootstrapError(''); setAuthInitializing(true); if (token) api.me(token).then(u => { setUser(u); setAuthInitializing(false); refresh(token).catch(err => { setError('Unable to load your applications. Please try again.'); console.error(err) }) }).catch(err => { if (err instanceof ApiError && err.status === 401) { localStorage.removeItem(TOKEN_KEY); setToken(null); setUser(null); setAuthInitializing(false) } else { setAuthBootstrapError('Unable to restore your session. Please retry.'); setAuthInitializing(false); console.error(err) } }) }}>RETRY SESSION →</Button></section></main>; if (!token || !user) { const mode = path === '/register' ? 'register' : 'login'; return <Auth mode={mode} onSuccess={(t, u) => { setToken(t); setUser(u); setAuthBootstrapError(''); go('/dashboard') }} /> }"
          if old not in text:
              raise SystemExit('render anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify auth bootstrap source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/src/App.tsx').read_text()
          checks = [
              "localStorage.getItem(TOKEN_KEY)",
              "const [authInitializing, setAuthInitializing]",
              "api.me(token)",
              "err instanceof ApiError && err.status === 401",
              "localStorage.removeItem(TOKEN_KEY)",
              "if (authInitializing) return",
          ]
          for check in checks:
              assert check in text, f'missing auth bootstrap contract: {check}'
          assert "catch(() => { localStorage.removeItem(TOKEN_KEY)" not in text
          print('Auth bootstrap regression contract: PASS')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git diff --cached --check
          git diff --cached -- frontend/src/App.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "fix: persist authentication across page refresh"
          git push origin HEAD:main
