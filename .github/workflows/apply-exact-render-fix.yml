name: Apply exact render fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the verified one-line fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          s = p.read_text()
          old = 'priorityFilter={le} setPriorityFilter={le}'
          new = 'priorityFilter={ce} setPriorityFilter={le}'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one bad prop wiring, found {count}')
          p.write_text(s.replace(old, new))
          print('Applied exact prop wiring fix.')
          PY
      - name: Verify fix and build frontend
        run: |
          grep -n 'priorityFilter=' src/App.tsx
          test "$(grep -o 'priorityFilter={le} setPriorityFilter={le}' src/App.tsx | wc -l)" -eq 0
          npm install --include=dev
          npm run build
        working-directory: frontend
      - name: Remove one-time fixer and commit
        run: |
          rm .github/workflows/apply-exact-render-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx .github/workflows/apply-exact-render-fix.yml
          git commit -m 'fix: pass priority filter value to applications page'
          git push origin HEAD:main
